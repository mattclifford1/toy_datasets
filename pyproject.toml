[project]
name = "toy_datasets"
version = "0.1.0"
description = "Default template for PDM package"
authors = [
    {name = "Matt Clifford", email = "mc15445@bristol.ac.uk"},
]
dependencies = ["numpy>=2.3.5", "scipy>=1.16.3", "scikit-learn>=1.7.2", "pandas>=2.3.3", "ucimlrepo>=0.0.7", "tqdm>=4.67.1", "torch>=2.7.1", "torchvision>=0.22.1", "umap-learn>=0.5.9.post2", "matplotlib>=3.10.7", "opentsne>=1.0.4", "imbalanced-learn>=0.14.1"]
requires-python = ">=3.11"
readme = "README.md"
license = {text = "MIT"}


[project.optional-dependencies]
dev = [
    "pip>=25.3",
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
]
[tool.pdm]
distribution = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

[tool.coverage.run]
source = ["data_loaders"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
